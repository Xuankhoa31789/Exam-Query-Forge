# ============================================================
# Production profile — PostgreSQL. Kích hoạt: SPRING_PROFILES_ACTIVE=prod
# Mọi thông tin nhạy cảm đọc từ biến môi trường, KHÔNG hardcode.
#
# Bắt buộc:
#   DATABASE_URL       dạng JDBC: jdbc:postgresql://host:5432/dbname
#                      (nếu platform chỉ cho postgres://user:pass@host/db thì
#                       đặt SPRING_DATASOURCE_URL/USERNAME/PASSWORD thay thế)
#   EQF_JWT_SECRET     chuỗi bí mật >= 32 byte
# Tùy chọn:
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#   PORT               (Render/Heroku tự đặt; mặc định 8080)
# ============================================================

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Không bật H2 console trên production
spring.h2.console.enabled=false

# JWT secret bắt buộc lấy từ env — app từ chối khởi động nếu thiếu
eqf.jwt.secret=${EQF_JWT_SECRET}
eqf.jwt.expiration-hours=24
