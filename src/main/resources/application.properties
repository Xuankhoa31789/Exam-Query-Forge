spring.application.name=exam-query-forge
server.port=8080

# H2 file-based database configuration
spring.datasource.url=jdbc:h2:file:./data/exam-query-forge
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Do NOT auto-run schema.sql on H2 (schema.postgres.sql is PostgreSQL reference only)
spring.sql.init.mode=never
