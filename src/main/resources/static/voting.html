<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Query Forge - Bình chọn & chốt đề</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="appShell"></div>

<div class="wrap">
  <div id="pageHead"></div>

  <div id="loginMsg" class="msg err" role="alert"></div>

  <div id="app" class="hidden">

    <section class="card">
      <h2>Chọn kỳ thi đang REVIEW</h2>
      <div id="pageMsg" class="msg" role="alert"></div>
      <div class="row">
        <div class="field" style="margin:0">
          <label for="examSelect">Kỳ thi</label>
          <select id="examSelect"><option value="">— Đang tải —</option></select>
        </div>
        <div class="field" style="margin:0">
          <label>&nbsp;</label>
          <div class="actions">
            <button id="reloadExamsBtn" class="btn-ghost" type="button">Làm mới</button>
            <button id="reloadCandidatesBtn" class="btn-ghost" type="button" disabled>Tải candidates</button>
          </div>
        </div>
      </div>
      <div id="examMeta" class="exam-meta hidden"></div>
      <div id="examActions" class="actions hidden">
        <button id="selectBtn" class="btn-primary" type="button">Chọn câu theo điểm</button>
        <button id="finalizeBtn" class="btn-danger" type="button">Chốt đề</button>
        <span class="muted">Chốt đề chỉ thành công với người tạo kỳ thi và khi đã chọn đủ ma trận.</span>
      </div>
    </section>

    <section id="candidateCard" class="card hidden">
      <h2>Danh sách candidates</h2>
      <div id="candidateEmpty" class="muted hidden">Kỳ thi này chưa có câu ứng viên.</div>
      <div id="candidateBuckets"></div>
    </section>

    <section id="finalCard" class="card hidden">
      <h2>Bộ đề cuối cùng</h2>
      <div id="finalEmpty" class="muted hidden">Chưa có câu SELECTED.</div>
      <div id="finalList" class="final-list"></div>
    </section>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/shell.js"></script>
<script>
  const DIFFICULTIES = [
    { value: 'RECOGNITION', label: 'Nhận biết', badge: 'b-rec' },
    { value: 'COMPREHENSION', label: 'Thông hiểu', badge: 'b-com' },
    { value: 'APPLICATION', label: 'Vận dụng', badge: 'b-app' },
    { value: 'HIGH_APPLICATION', label: 'Vận dụng cao', badge: 'b-high' }
  ];
  const QUESTION_TYPES = {
    MULTIPLE_CHOICE: 'Trắc nghiệm',
    TRUE_FALSE: 'Đúng/Sai',
    ESSAY: 'Tự luận'
  };

  let currentUserId = null;
  let currentExam = null;
  let currentExamId = null;
  let reviewExams = [];

  function showMsg(element, text, ok) {
    element.textContent = text;
    element.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  function hideMsg(element) {
    element.textContent = '';
    element.className = 'msg';
  }

  function userIdFromToken(data) {
    return eqfUserId(data);
  }

  async function apiJson(url, options = {}) {
    const response = await apiFetch(url, options);
    let data = null;
    try { data = await response.json(); } catch (error) { /* response without JSON */ }
    if (!response.ok) {
      throw new Error(data && data.message ? data.message : 'Yêu cầu thất bại (HTTP ' + response.status + ')');
    }
    return data;
  }

  async function openVotingBoard(data, messageElement) {
    const userId = userIdFromToken(data);
    if (!userId) {
      if (messageElement) showMsg(messageElement, 'Không đọc được userId từ phiên đăng nhập', false);
      return false;
    }

    currentUserId = userId;
    document.getElementById('app').classList.remove('hidden');
    await loadReviewExams();
    return true;
  }


  async function loadReviewExams() {
    const select = document.getElementById('examSelect');
    const message = document.getElementById('pageMsg');
    hideMsg(message);
    select.innerHTML = '<option value="">— Đang tải —</option>';
    resetExamView();
    try {
      reviewExams = await apiJson('/api/exams?status=REVIEW');
      if (!reviewExams.length) {
        select.innerHTML = '<option value="">— Chưa có kỳ thi REVIEW —</option>';
        showMsg(message, 'Chưa có kỳ thi nào ở trạng thái REVIEW. Hãy tạo kỳ thi và rút candidates ở trang Kỳ thi.', true);
        return;
      }
      select.innerHTML = '<option value="">— Chọn kỳ thi —</option>';
      reviewExams.forEach(exam => {
        const option = document.createElement('option');
        option.value = exam.id;
        option.textContent = '#' + exam.id + ' - ' + exam.title + ' (' + exam.subjectName + ')';
        select.appendChild(option);
      });
    } catch (error) {
      select.innerHTML = '<option value="">— Không tải được kỳ thi —</option>';
      showMsg(message, error.message, false);
    }
  }

  function resetExamView() {
    currentExam = null;
    currentExamId = null;
    document.getElementById('reloadCandidatesBtn').disabled = true;
    document.getElementById('examMeta').classList.add('hidden');
    document.getElementById('examMeta').innerHTML = '';
    document.getElementById('examActions').classList.add('hidden');
    document.getElementById('candidateCard').classList.add('hidden');
    document.getElementById('candidateBuckets').innerHTML = '';
    document.getElementById('finalCard').classList.add('hidden');
    document.getElementById('finalList').innerHTML = '';
  }

  async function chooseExam() {
    const examId = Number(document.getElementById('examSelect').value);
    hideMsg(document.getElementById('pageMsg'));
    if (!examId) {
      resetExamView();
      return;
    }
    currentExamId = examId;
    currentExam = reviewExams.find(exam => exam.id === examId) || await apiJson('/api/exams/' + examId);
    renderExamMeta(currentExam);
    await loadCandidates();
  }

  function renderExamMeta(exam) {
    const meta = document.getElementById('examMeta');
    meta.innerHTML =
      metaItem('ID kỳ thi', '#' + exam.id) +
      metaItem('Tên kỳ thi', escapeHtml(exam.title)) +
      metaItem('Bộ môn', escapeHtml(exam.subjectName)) +
      metaItem('Trạng thái', '<span class="badge b-candidate">' + escapeHtml(exam.status) + '</span>') +
      metaItem('Người tạo', escapeHtml(exam.createdByName || '')) +
      metaItem('Tổng số câu', exam.totalQuestions) +
      metaItem('Số candidates', exam.candidateCount) +
      metaItem('Ngày thi', exam.examDate || '—');
    meta.classList.remove('hidden');
    document.getElementById('examActions').classList.remove('hidden');
    document.getElementById('reloadCandidatesBtn').disabled = false;
  }

  function metaItem(label, value) {
    return '<div class="meta-item"><span class="meta-label">' + label + '</span><span class="meta-value">' + value + '</span></div>';
  }

  async function loadCandidates() {
    if (!currentExamId) return;
    const message = document.getElementById('pageMsg');
    hideMsg(message);
    try {
      const candidates = await apiJson('/api/exams/' + currentExamId + '/candidates/voting');
      renderCandidates(candidates);
    } catch (error) {
      showMsg(message, error.message, false);
    }
  }

  function renderCandidates(candidates) {
    const card = document.getElementById('candidateCard');
    const empty = document.getElementById('candidateEmpty');
    const buckets = document.getElementById('candidateBuckets');
    buckets.innerHTML = '';
    card.classList.remove('hidden');

    if (!candidates.length) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    DIFFICULTIES.forEach(difficulty => {
      const bucketItems = candidates.filter(candidate => candidate.difficulty === difficulty.value);
      if (!bucketItems.length) return;
      const required = requiredCount(difficulty.value);
      const selected = bucketItems.filter(candidate => candidate.status === 'SELECTED').length;
      const section = document.createElement('section');
      section.className = 'bucket';
      section.innerHTML =
        '<div class="bucket-head"><h3><span class="badge ' + difficulty.badge + '">' + difficulty.label + '</span></h3>' +
        '<span class="muted">Đã chọn ' + selected + ' / cần ' + required + '</span></div>' +
        bucketItems.map(renderCandidate).join('');
      buckets.appendChild(section);
    });
  }

  function renderCandidate(candidate) {
    const difficulty = difficultyInfo(candidate.difficulty);
    const statusClass = candidate.status === 'SELECTED' ? 'b-selected' : (candidate.status === 'REJECTED' ? 'b-rejected' : 'b-candidate');
    const commentOpen = candidate.myVoteValue === 0 || candidate.myVoteValue === -1;
    return '<article class="candidate" data-candidate-id="' + candidate.id + '" data-pending-value="' + (candidate.myVoteValue == null ? '' : candidate.myVoteValue) + '">' +
      '<div class="candidate-top">' +
      '<div><p class="candidate-content"><b>#' + candidate.questionId + '</b> ' + escapeHtml(candidate.content) + '</p>' +
      '<div class="candidate-meta">' +
      '<span class="badge ' + difficulty.badge + '">' + difficulty.label + '</span>' +
      '<span class="badge ' + statusClass + '">' + escapeHtml(candidate.status) + '</span>' +
      '<span class="muted">' + escapeHtml(QUESTION_TYPES[candidate.questionType] || candidate.questionType) + '</span>' +
      '<span class="muted">Tác giả: ' + escapeHtml(candidate.authorName || '') + '</span>' +
      '</div></div>' +
      '<div class="score"><span>Tổng điểm</span><strong>' + candidate.totalScore + '</strong></div>' +
      '</div>' +
      '<div class="vote-row">' +
      voteButton(candidate, 1, '+1 Nên dùng') +
      voteButton(candidate, 0, '0 Cần sửa') +
      voteButton(candidate, -1, '-1 Loại') +
      '</div>' +
      '<div class="comment-box ' + (commentOpen ? '' : 'hidden') + '">' +
      '<textarea class="vote-comment" placeholder="Lý do hoặc góp ý bắt buộc khi vote 0 / -1">' + escapeHtml(candidate.myVoteComment || '') + '</textarea>' +
      '<button class="btn-primary btn-small submit-comment" type="button">Gửi góp ý</button>' +
      '</div>' +
      '</article>';
  }

  function voteButton(candidate, value, label) {
    const disabled = currentExam && currentExam.status === 'FINALIZED' ? ' disabled' : '';
    return '<button class="vote-btn btn-small' + (candidate.myVoteValue === value ? ' active' : '') +
      '" type="button" data-value="' + value + '"' + disabled + '>' + label + '</button>';
  }

  async function handleCandidateClick(event) {
    const voteButton = event.target.closest('.vote-btn');
    const submitButton = event.target.closest('.submit-comment');
    const card = event.target.closest('.candidate');
    if (!card) return;

    if (voteButton) {
      const value = Number(voteButton.dataset.value);
      card.dataset.pendingValue = String(value);
      if (value === 1) {
        await castVote(Number(card.dataset.candidateId), 1, null);
      } else {
        card.querySelector('.comment-box').classList.remove('hidden');
        card.querySelector('.vote-comment').focus();
      }
    }

    if (submitButton) {
      const value = Number(card.dataset.pendingValue);
      const comment = card.querySelector('.vote-comment').value.trim();
      if (value !== 0 && value !== -1) {
        showMsg(document.getElementById('pageMsg'), 'Hãy chọn vote 0 hoặc -1 trước khi gửi góp ý', false);
        return;
      }
      if (!comment) {
        showMsg(document.getElementById('pageMsg'), 'Vote 0 hoặc -1 bắt buộc phải có comment', false);
        return;
      }
      await castVote(Number(card.dataset.candidateId), value, comment);
    }
  }

  async function castVote(candidateId, value, comment) {
    const message = document.getElementById('pageMsg');
    hideMsg(message);
    try {
      await apiJson('/api/candidates/' + candidateId + '/vote', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ value, comment })
      });
      showMsg(message, 'Đã lưu vote cho candidate #' + candidateId, true);
      await loadCandidates();
    } catch (error) {
      showMsg(message, error.message, false);
    }
  }

  async function selectByScore() {
    if (!currentExamId) return;
    const button = document.getElementById('selectBtn');
    const message = document.getElementById('pageMsg');
    hideMsg(message);
    setButtonLoading(button, true, 'Đang chọn...');
    try {
      await apiJson('/api/exams/' + currentExamId + '/select', { method: 'POST' });
      showMsg(message, 'Đã chọn câu theo tổng điểm vote', true);
      await loadCandidates();
    } catch (error) {
      showMsg(message, error.message, false);
    } finally {
      setButtonLoading(button, false);
    }
  }

  async function finalizeExam() {
    if (!currentExamId) return;
    const button = document.getElementById('finalizeBtn');
    const message = document.getElementById('pageMsg');
    let completed = false;
    hideMsg(message);
    setButtonLoading(button, true, 'Đang chốt...');
    try {
      await apiJson('/api/exams/' + currentExamId + '/finalize', { method: 'POST' });
      if (currentExam) {
        currentExam.status = 'FINALIZED';
        renderExamMeta(currentExam);
      }
      showMsg(message, 'Đã chốt đề. Bộ đề cuối cùng hiển thị bên dưới.', true);
      completed = true;
      await loadFinalExam();
      await loadCandidates();
    } catch (error) {
      showMsg(message, error.message, false);
    } finally {
      setButtonLoading(button, false);
      if (completed) {
        document.getElementById('selectBtn').disabled = true;
        document.getElementById('finalizeBtn').disabled = true;
      }
    }
  }

  async function loadFinalExam() {
    const finalCard = document.getElementById('finalCard');
    const finalList = document.getElementById('finalList');
    const finalEmpty = document.getElementById('finalEmpty');
    const finalCandidates = await apiJson('/api/exams/' + currentExamId + '/final');
    finalList.innerHTML = '';
    finalCard.classList.remove('hidden');
    if (!finalCandidates.length) {
      finalEmpty.classList.remove('hidden');
      return;
    }
    finalEmpty.classList.add('hidden');
    finalCandidates.forEach((candidate, index) => {
      const difficulty = difficultyInfo(candidate.difficulty);
      const item = document.createElement('div');
      item.className = 'final-item';
      item.innerHTML =
        '<div class="final-index">' + (index + 1) + '</div>' +
        '<div><div class="candidate-content"><b>#' + candidate.questionId + '</b> ' + escapeHtml(candidate.content) + '</div>' +
        '<div class="candidate-meta"><span class="badge ' + difficulty.badge + '">' + difficulty.label + '</span>' +
        '<span class="muted">' + escapeHtml(QUESTION_TYPES[candidate.questionType] || candidate.questionType) + '</span></div></div>';
      finalList.appendChild(item);
    });
  }

  function requiredCount(difficulty) {
    if (!currentExam || !currentExam.matrix) return 0;
    const row = currentExam.matrix.find(item => item.difficulty === difficulty);
    return row ? row.requiredCount : 0;
  }

  function difficultyInfo(value) {
    return DIFFICULTIES.find(item => item.value === value) || { value, label: value, badge: '' };
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function setButtonLoading(button, loading, loadingText) {
    if (!button.dataset.originalText) button.dataset.originalText = button.textContent;
    button.disabled = loading;
    button.textContent = loading ? loadingText : button.dataset.originalText;
  }

  document.getElementById('reloadExamsBtn').addEventListener('click', loadReviewExams);
  document.getElementById('reloadCandidatesBtn').addEventListener('click', loadCandidates);
  document.getElementById('examSelect').addEventListener('change', chooseExam);
  document.getElementById('candidateBuckets').addEventListener('click', handleCandidateClick);
  document.getElementById('selectBtn').addEventListener('click', selectByScore);
  document.getElementById('finalizeBtn').addEventListener('click', finalizeExam);

  const savedLogin = eqfRequireLogin();
  if (savedLogin) {
    eqfRenderShell({ title: 'Bình chọn & chốt đề', active: 'voting' });
    openVotingBoard(savedLogin, document.getElementById('loginMsg')).catch(error => {
      showMsg(document.getElementById('loginMsg'), error.message, false);
    });
  }
</script>
</body>
</html>
