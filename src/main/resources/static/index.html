<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam Query Forge - Login</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
    <section class="login-panel">
        <div id="loginContainer" class="login-container">
            <div class="login-header">
                <h1>Exam Query Forge</h1>
                <p class="login-subtitle">Welcome back! Please login to continue.</p>
            </div>

            <div id="messageBox" class="message-box hidden"></div>

            <form id="loginForm" class="login-form">
                <label>
                    Email
                    <input name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
                </label>
                <label>
                    Password
                    <input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                </label>
                
                <button type="submit" class="btn-primary btn-login">Login</button>
                
                <div class="login-actions">
                    <button type="button" id="registerBtn" class="btn-secondary btn-register">Register</button>
                    <a href="#" id="forgotPasswordLink" class="forgot-password-link">Forgot password?</a>
                </div>
            </form>
        </div>

        <div id="registerContainer" class="register-container hidden">
            <div class="register-header">
                <button id="backBtn" class="btn-back">&larr; Back to Login</button>
                <h2>Create Account</h2>
                <p class="register-subtitle">Join us today! Register for a new account.</p>
            </div>

            <div id="messageBox2" class="message-box hidden"></div>

            <form id="registerForm" class="register-form">
                <label>
                    Name
                    <input name="name" type="text" autocomplete="name" placeholder="Enter your full name" required>
                </label>
                <label>
                    Email
                    <input name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
                </label>
                <label>
                    Password
                    <input name="password" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" minlength="6" required>
                </label>
                <button type="submit" class="btn-primary btn-register-submit">Create account</button>
            </form>
        </div>

        <div id="userInfo" class="user-info hidden">
            <div class="welcome-container">
                <h2>Welcome!</h2>
                <p>You are logged in as <strong id="userName"></strong></p>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </div>
    </section>
    <div id="output" style="display: none;"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
