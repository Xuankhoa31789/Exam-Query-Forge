<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Query Forge — Quản lý kỳ thi</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="appShell"></div>

<div class="wrap">
  <div id="pageHead"></div>

  <div id="loginMsg" class="msg err" role="alert"></div>

  <div id="app" class="hidden">

    <section class="card">
      <h2>Tạo kỳ thi mới</h2>
      <div id="formMsg" class="msg" role="alert"></div>

      <div class="row">
        <div class="field" style="margin:0">
          <label for="title">Tên kỳ thi</label>
          <input id="title" type="text" maxlength="255" placeholder="Ví dụ: Kiểm tra giữa kỳ I">
        </div>
        <div class="field" style="margin:0">
          <label for="subject">Bộ môn</label>
          <select id="subject"><option value="">— Đang tải —</option></select>
        </div>
      </div>

      <div class="row-3">
        <div class="field" style="margin:0">
          <label for="grade">Lớp <span class="muted">(tùy chọn)</span></label>
          <input id="grade" type="number" min="1" max="12" placeholder="10">
        </div>
        <div class="field" style="margin:0">
          <label for="examDate">Ngày thi <span class="muted">(tùy chọn)</span></label>
          <input id="examDate" type="date">
        </div>
        <div class="field" style="margin:0">
          <label for="candidateMultiplier">Hệ số nhân ứng viên</label>
          <input id="candidateMultiplier" type="number" min="0.1" max="99.9" step="0.1" value="2.5">
        </div>
      </div>

      <div class="field">
        <label for="totalQuestions">Tổng số câu của đề</label>
        <input id="totalQuestions" type="number" min="1" placeholder="50">
      </div>

      <h2 style="margin-top:24px">Ma trận đề</h2>
      <p class="muted">Mỗi mức độ chỉ nên xuất hiện một lần. Tổng số câu trong ma trận phải bằng tổng số câu của đề.</p>
      <div class="matrix-head" aria-hidden="true">
        <span>Độ khó</span><span>Số câu cần</span><span></span>
      </div>
      <div id="matrixRows"></div>
      <div class="matrix-summary">
        <span>Số dòng: <strong id="matrixRowCount">0</strong></span>
        <span>Tổng ma trận: <strong id="matrixTotal">0</strong> câu</span>
      </div>
      <div class="actions">
        <button id="addMatrixBtn" class="btn-ghost btn-small" type="button">+ Thêm dòng ma trận</button>
        <button id="createExamBtn" class="btn-primary" type="button">Tạo kỳ thi</button>
      </div>
    </section>

    <section id="examResultCard" class="card hidden">
      <h2>Kỳ thi vừa tạo</h2>
      <div id="examMsg" class="msg" role="alert"></div>
      <div id="examMeta" class="exam-meta"></div>
      <div>
        <span class="muted">Ma trận</span>
        <div id="matrixView" class="matrix-view"></div>
      </div>
      <div class="actions">
        <button id="pullCandidatesBtn" class="btn-primary" type="button">Rút câu ứng viên</button>
        <span class="muted">Cooldown: 365 ngày</span>
      </div>
    </section>

    <section id="candidateResultCard" class="card hidden">
      <h2>Kết quả rút câu ứng viên</h2>
      <div id="candidateMsg" class="msg" role="alert"></div>
      <div id="countGrid" class="count-grid"></div>
      <div id="candidateEmpty" class="muted hidden">Chưa có câu ứng viên.</div>
      <div id="candidateTableWrap" class="table-wrap hidden">
        <table>
          <thead>
          <tr><th>#</th><th>Câu hỏi</th><th>Độ khó</th><th>Loại</th><th>Trạng thái</th><th>Tác giả</th></tr>
          </thead>
          <tbody id="candidateBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/shell.js"></script>
<script>
  const COOLDOWN_DAYS = 365;
  const DIFFICULTIES = [
    { value: 'RECOGNITION', label: 'Nhận biết', badge: 'b-rec' },
    { value: 'COMPREHENSION', label: 'Thông hiểu', badge: 'b-com' },
    { value: 'APPLICATION', label: 'Vận dụng', badge: 'b-app' },
    { value: 'HIGH_APPLICATION', label: 'Vận dụng cao', badge: 'b-high' }
  ];
  const QUESTION_TYPES = {
    MULTIPLE_CHOICE: 'Trắc nghiệm', TRUE_FALSE: 'Đúng/Sai', ESSAY: 'Tự luận'
  };

  let currentUserId = null;
  let currentExamId = null;

  function showMsg(element, text, ok) {
    element.textContent = text;
    element.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  function hideMsg(element) {
    element.textContent = '';
    element.className = 'msg';
  }

  function userIdFromToken(data) {
    return eqfUserId(data);
  }

  async function apiJson(url, options = {}) {
    const response = await apiFetch(url, options);
    let data = null;
    try { data = await response.json(); } catch (error) { /* response không có JSON */ }
    if (!response.ok) {
      throw new Error(data && data.message ? data.message : 'Yêu cầu thất bại (HTTP ' + response.status + ')');
    }
    return data;
  }

  async function openExamBoard(data, messageElement) {
    const userId = userIdFromToken(data);
    if (!userId) {
      if (messageElement) showMsg(messageElement, 'Không đọc được userId từ phiên đăng nhập', false);
      return false;
    }

    currentUserId = userId;
    document.getElementById('app').classList.remove('hidden');
    await loadSubjects();
    return true;
  }

  async function loadSubjects() {
    const select = document.getElementById('subject');
    try {
      const subjects = await apiJson('/api/subjects');
      select.innerHTML = '<option value="">— Chọn bộ môn —</option>';
      subjects.forEach(subject => {
        const option = document.createElement('option');
        option.value = subject.id;
        option.textContent = subject.name;
        select.appendChild(option);
      });
    } catch (error) {
      select.innerHTML = '<option value="">— Không tải được bộ môn —</option>';
      showMsg(document.getElementById('formMsg'), error.message, false);
    }
  }

  function addMatrixRow(difficulty) {
    const rows = document.getElementById('matrixRows');
    const used = new Set([...rows.querySelectorAll('.matrix-difficulty')].map(select => select.value));
    const selected = difficulty || (DIFFICULTIES.find(item => !used.has(item.value)) || DIFFICULTIES[0]).value;
    const row = document.createElement('div');
    row.className = 'matrix-row';
    row.innerHTML =
      '<div><label>Độ khó</label><select class="matrix-difficulty">' +
      DIFFICULTIES.map(item => '<option value="' + item.value + '"' + (item.value === selected ? ' selected' : '') + '>' + item.label + '</option>').join('') +
      '</select></div>' +
      '<div><label>Số câu cần</label><input class="matrix-count" type="number" min="1" value="1"></div>' +
      '<button class="btn-danger btn-small remove-matrix" type="button">Xóa</button>';
    row.querySelector('.remove-matrix').addEventListener('click', () => {
      row.remove();
      updateMatrixSummary();
    });
    row.querySelector('.matrix-count').addEventListener('input', updateMatrixSummary);
    rows.appendChild(row);
    updateMatrixSummary();
  }

  function updateMatrixSummary() {
    const rows = [...document.querySelectorAll('.matrix-row')];
    const total = rows.reduce((sum, row) => sum + (Number(row.querySelector('.matrix-count').value) || 0), 0);
    document.getElementById('matrixRowCount').textContent = rows.length;
    document.getElementById('matrixTotal').textContent = total;
  }

  function readExamForm() {
    const title = document.getElementById('title').value.trim();
    const subjectId = Number(document.getElementById('subject').value);
    const gradeText = document.getElementById('grade').value;
    const examDate = document.getElementById('examDate').value;
    const totalQuestions = Number(document.getElementById('totalQuestions').value);
    const candidateMultiplier = Number(document.getElementById('candidateMultiplier').value);
    const rows = [...document.querySelectorAll('.matrix-row')];
    const matrix = rows.map(row => ({
      difficulty: row.querySelector('.matrix-difficulty').value,
      requiredCount: Number(row.querySelector('.matrix-count').value)
    }));

    if (!title) throw new Error('Vui lòng nhập tên kỳ thi');
    if (!subjectId) throw new Error('Vui lòng chọn bộ môn');
    if (!Number.isInteger(totalQuestions) || totalQuestions <= 0) throw new Error('Tổng số câu phải là số nguyên lớn hơn 0');
    if (!Number.isFinite(candidateMultiplier) || candidateMultiplier <= 0) throw new Error('Hệ số nhân ứng viên phải lớn hơn 0');
    if (!matrix.length) throw new Error('Ma trận kỳ thi không được để trống');
    if (matrix.some(row => !Number.isInteger(row.requiredCount) || row.requiredCount <= 0)) throw new Error('Số câu cần của mỗi dòng phải là số nguyên lớn hơn 0');
    if (new Set(matrix.map(row => row.difficulty)).size !== matrix.length) throw new Error('Mỗi mức độ chỉ được xuất hiện một lần trong ma trận');
    const matrixTotal = matrix.reduce((sum, row) => sum + row.requiredCount, 0);
    if (matrixTotal !== totalQuestions) throw new Error('Tổng số câu trong ma trận phải bằng tổng số câu của đề');

    return {
      title,
      subjectId,
      grade: gradeText ? Number(gradeText) : null,
      totalQuestions,
      candidateMultiplier,
      examDate: examDate || null,
      matrix
    };
  }

  async function createExam() {
    const button = document.getElementById('createExamBtn');
    const message = document.getElementById('formMsg');
    hideMsg(message);
    let request;
    try {
      request = readExamForm();
    } catch (error) {
      showMsg(message, error.message, false);
      return;
    }

    setButtonLoading(button, true, 'Đang tạo...');
    try {
      const created = await apiJson('/api/exams', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(request)
      });
      currentExamId = created.id;
      showMsg(message, 'Đã tạo kỳ thi #' + created.id + ' — trạng thái ' + created.status, true);
      const details = await apiJson('/api/exams/' + created.id);
      renderExamDetails(details);
      resetCandidateView();
    } catch (error) {
      showMsg(message, error.message, false);
    } finally {
      setButtonLoading(button, false);
    }
  }

  function renderExamDetails(exam) {
    currentExamId = exam.id;
    const status = '<span class="badge b-status">' + escapeHtml(exam.status) + '</span>';
    document.getElementById('examMeta').innerHTML =
      metaItem('ID kỳ thi', '#' + exam.id) + metaItem('Tên kỳ thi', escapeHtml(exam.title)) +
      metaItem('Bộ môn', escapeHtml(exam.subjectName)) + metaItem('Trạng thái', status) +
      metaItem('Lớp', exam.grade || '—') + metaItem('Ngày thi', exam.examDate || '—') +
      metaItem('Tổng số câu', exam.totalQuestions) + metaItem('Hệ số ứng viên', exam.candidateMultiplier);
    document.getElementById('matrixView').innerHTML = (exam.matrix || []).map(row => {
      const difficulty = difficultyInfo(row.difficulty);
      return '<span class="matrix-chip"><span class="badge ' + difficulty.badge + '">' + difficulty.label + '</span> × <b>' + row.requiredCount + '</b></span>';
    }).join('');
    document.getElementById('examResultCard').classList.remove('hidden');
    const pullButton = document.getElementById('pullCandidatesBtn');
    pullButton.disabled = exam.status !== 'DRAFT';
    pullButton.dataset.originalText = exam.status === 'DRAFT' ? 'Rút câu ứng viên' : 'Đã rút câu ứng viên';
    pullButton.textContent = pullButton.dataset.originalText;
  }

  function metaItem(label, value) {
    return '<div class="meta-item"><span class="meta-label">' + label + '</span><span class="meta-value">' + value + '</span></div>';
  }

  async function pullCandidates() {
    if (!currentExamId) return;
    const button = document.getElementById('pullCandidatesBtn');
    const examMessage = document.getElementById('examMsg');
    const candidateMessage = document.getElementById('candidateMsg');
    hideMsg(examMessage);
    hideMsg(candidateMessage);
    setButtonLoading(button, true, 'Đang rút câu...');
    let completed = false;
    try {
      const result = await apiJson('/api/exams/' + currentExamId + '/candidates/pull?cooldownDays=' + COOLDOWN_DAYS, { method: 'POST' });
      showMsg(examMessage, 'Đã rút ' + result.candidateCount + ' câu ứng viên', true);
      renderCandidateCounts(result.countByDifficulty || {});
      const [details, candidates] = await Promise.all([
        apiJson('/api/exams/' + currentExamId),
        apiJson('/api/exams/' + currentExamId + '/candidates')
      ]);
      renderExamDetails(details);
      renderCandidates(candidates);
      completed = true;
    } catch (error) {
      showMsg(examMessage, error.message, false);
    } finally {
      setButtonLoading(button, false);
      if (completed) button.disabled = true;
    }
  }

  function renderCandidateCounts(counts) {
    document.getElementById('countGrid').innerHTML = DIFFICULTIES.map(item =>
      '<div class="count-box"><span>' + item.label + '</span><strong>' + (counts[item.value] || 0) + '</strong></div>'
    ).join('');
    document.getElementById('candidateResultCard').classList.remove('hidden');
  }

  function renderCandidates(candidates) {
    const body = document.getElementById('candidateBody');
    const empty = document.getElementById('candidateEmpty');
    const table = document.getElementById('candidateTableWrap');
    body.innerHTML = '';
    if (!candidates.length) {
      empty.classList.remove('hidden');
      table.classList.add('hidden');
      return;
    }
    empty.classList.add('hidden');
    table.classList.remove('hidden');
    candidates.forEach((candidate, index) => {
      const difficulty = difficultyInfo(candidate.difficulty);
      const row = document.createElement('tr');
      row.innerHTML =
        '<td>' + (index + 1) + '</td>' +
        '<td class="content-cell"><b>#' + candidate.questionId + '</b> ' + escapeHtml(candidate.content) + '</td>' +
        '<td><span class="badge ' + difficulty.badge + '">' + difficulty.label + '</span></td>' +
        '<td>' + escapeHtml(QUESTION_TYPES[candidate.questionType] || candidate.questionType) + '</td>' +
        '<td><span class="badge b-status">' + escapeHtml(candidate.status) + '</span></td>' +
        '<td>' + escapeHtml(candidate.authorName || '') + '</td>';
      body.appendChild(row);
    });
  }

  function resetCandidateView() {
    document.getElementById('candidateResultCard').classList.add('hidden');
    document.getElementById('candidateBody').innerHTML = '';
    document.getElementById('countGrid').innerHTML = '';
    hideMsg(document.getElementById('examMsg'));
  }

  function difficultyInfo(value) {
    return DIFFICULTIES.find(item => item.value === value) || { value, label: value, badge: '' };
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function setButtonLoading(button, loading, loadingText) {
    if (!button.dataset.originalText) button.dataset.originalText = button.textContent;
    button.disabled = loading;
    button.textContent = loading ? loadingText : button.dataset.originalText;
  }

  document.getElementById('addMatrixBtn').addEventListener('click', () => addMatrixRow());
  document.getElementById('createExamBtn').addEventListener('click', createExam);
  document.getElementById('pullCandidatesBtn').addEventListener('click', pullCandidates);

  addMatrixRow('RECOGNITION');
  const savedLogin = eqfRequireLogin();
  if (savedLogin) {
    eqfRenderShell({ title: 'Kỳ thi & ma trận đề', active: 'exams' });
    openExamBoard(savedLogin, document.getElementById('loginMsg')).catch(error => {
      showMsg(document.getElementById('loginMsg'), error.message, false);
    });
  }
</script>
</body>
</html>
