<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Query Forge — Ngân hàng câu hỏi</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="appShell"></div>

<div class="wrap">
  <div id="pageHead"></div>

  <div id="loginMsg" class="msg err" role="alert"></div>

  <!-- APP (hiện sau khi shell xác nhận đã đăng nhập) -->
  <div id="app" class="hidden">

    <!-- CREATE -->
    <section class="card">
      <h2>Thêm câu hỏi mới</h2>
      <div class="ai-note">⚙️ Phân tích AI đang ở bản thử nghiệm (heuristic) — gắn mô hình AI thật khi có API key.</div>
      <div id="formMsg" class="msg"></div>
      <div class="row">
        <div class="field" style="margin:0">
          <label>Bộ môn</label>
          <select id="subject" onchange="loadChapters()"></select>
        </div>
        <div class="field" style="margin:0">
          <label>Chương (tùy chọn)</label>
          <select id="chapter"><option value="">— Không chọn —</option></select>
        </div>
      </div>
      <div class="row">
        <div class="field" style="margin:0">
          <label>Độ khó</label>
          <select id="difficulty">
            <option value="RECOGNITION">Nhận biết</option>
            <option value="COMPREHENSION">Thông hiểu</option>
            <option value="APPLICATION">Vận dụng</option>
            <option value="HIGH_APPLICATION">Vận dụng cao</option>
          </select>
        </div>
        <div class="field" style="margin:0">
          <label>Loại câu hỏi</label>
          <select id="qtype">
            <option value="MULTIPLE_CHOICE">Trắc nghiệm</option>
            <option value="TRUE_FALSE">Đúng / Sai</option>
            <option value="ESSAY">Tự luận</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Nội dung câu hỏi</label>
        <textarea id="content" placeholder="Nhập đề câu hỏi..."></textarea>
        <div class="ai-tip">💡 Gõ đề xong, nhấn <b>Tab</b> trong ô này để AI gợi ý &amp; tự điền độ khó.</div>
        <div id="aiHint" class="ai-hint"></div>
      </div>
      <div class="field">
        <label>Phương án trả lời <span class="muted">(tích vào ô đáp án đúng)</span></label>
        <div id="options"></div>
        <button class="btn-ghost btn-small" onclick="addOption()">+ Thêm phương án</button>
      </div>
      <button class="btn-primary" onclick="submitQuestion()">Lưu vào pool</button>
    </section>

    <!-- POOL -->
    <section class="card">
      <h2>Pool câu hỏi</h2>
      <div class="toolbar">
        <div class="field">
          <label>Lọc theo bộ môn</label>
          <select id="filterSubject" onchange="loadPool()"></select>
        </div>
        <button class="btn-ghost btn-small" onclick="loadPool()">Làm mới</button>
      </div>
      <div id="poolEmpty" class="muted">Chưa có câu hỏi nào trong pool.</div>
      <table id="poolTable" class="hidden">
        <thead><tr><th>#</th><th>Nội dung</th><th>Độ khó</th><th>Loại</th><th>Trạng thái</th><th>Tác giả</th></tr></thead>
        <tbody id="poolBody"></tbody>
      </table>
    </section>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/shell.js"></script>
<script>
  let currentUserId = null;

  const DIFF = { RECOGNITION:['Nhận biết','b-rec'], COMPREHENSION:['Thông hiểu','b-com'],
                 APPLICATION:['Vận dụng','b-app'], HIGH_APPLICATION:['Vận dụng cao','b-high'] };
  const QTYPE = { MULTIPLE_CHOICE:'Trắc nghiệm', TRUE_FALSE:'Đúng/Sai', ESSAY:'Tự luận' };

  function showMsg(el, text, ok) {
    el.textContent = text;
    el.className = 'msg show ' + (ok ? 'ok' : 'err');
  }
  function hideMsg(el) { el.className = 'msg'; }

  function getLoginUserId(data) {
    return eqfUserId(data);
  }

  async function openQuestionBoard(data, msg) {
    currentUserId = getLoginUserId(data);
    if (!currentUserId) {
      if (msg) showMsg(msg, 'Không đọc được ID người dùng từ phiên đăng nhập', false);
      return false;
    }

    document.getElementById('app').classList.remove('hidden');
    document.getElementById('options').innerHTML = '';
    await loadSubjects();
    addOption();
    addOption();
    loadPool();
    return true;
  }

  async function loadSubjects() {
    const res = await apiFetch('/api/subjects');
    const subjects = await res.json();
    const opts = subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    document.getElementById('subject').innerHTML = opts;
    document.getElementById('filterSubject').innerHTML =
      '<option value="">— Tất cả —</option>' + opts;
    loadChapters();
  }

  async function loadChapters() {
    const subjectId = document.getElementById('subject').value;
    const sel = document.getElementById('chapter');
    sel.innerHTML = '<option value="">— Không chọn —</option>';
    if (!subjectId) return;
    const res = await apiFetch('/api/chapters?subjectId=' + subjectId);
    const chapters = await res.json();
    chapters.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name + (c.grade ? ' (lớp ' + c.grade + ')' : '');
      sel.appendChild(o);
    });
  }

  function addOption(text = '', correct = false) {
    const wrap = document.getElementById('options');
    const div = document.createElement('div');
    div.className = 'option-row';
    div.innerHTML =
      `<input type="text" placeholder="Nội dung phương án" value="${text.replace(/"/g,'&quot;')}">
       <label class="chk"><input type="checkbox" ${correct?'checked':''}> Đáp án đúng</label>
       <button class="btn-danger btn-small" onclick="this.parentElement.remove()">Xóa</button>`;
    wrap.appendChild(div);
  }

  async function submitQuestion() {
    const msg = document.getElementById('formMsg');
    hideMsg(msg);
    const content = document.getElementById('content').value.trim();
    if (!content) { showMsg(msg, 'Vui lòng nhập nội dung câu hỏi', false); return; }

    const options = [];
    document.querySelectorAll('#options .option-row').forEach((row, i) => {
      const text = row.querySelector('input[type=text]').value.trim();
      if (text) options.push({
        content: text,
        correct: row.querySelector('input[type=checkbox]').checked,
        sortOrder: i + 1
      });
    });

    const body = {
      subjectId: Number(document.getElementById('subject').value),
      chapterId: document.getElementById('chapter').value ? Number(document.getElementById('chapter').value) : null,
      content: content,
      questionType: document.getElementById('qtype').value,
      difficulty: document.getElementById('difficulty').value,
      options: options
    };

    try {
      // 1) tạo câu hỏi (DRAFT) — tác giả là người đang đăng nhập (server đọc từ JWT)
      const res = await apiFetch('/api/questions', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { showMsg(msg, data.message || 'Không tạo được câu hỏi', false); return; }

      // 2) đẩy vào pool (IN_POOL) để hiện ngay
      await apiFetch('/api/questions/' + data.id + '/publish', { method: 'POST' });

      showMsg(msg, '✓ Đã lưu câu hỏi #' + data.id + ' vào pool', true);
      document.getElementById('content').value = '';
      document.getElementById('options').innerHTML = '';
      addOption(); addOption();
      loadPool();
    } catch (e) { showMsg(msg, 'Lỗi kết nối: ' + e.message, false); }
  }

  async function loadPool() {
    const subjectId = document.getElementById('filterSubject').value;
    const url = '/api/questions' + (subjectId ? '?subjectId=' + subjectId : '');
    const res = await apiFetch(url);
    const list = await res.json();
    const body = document.getElementById('poolBody');
    const table = document.getElementById('poolTable');
    const empty = document.getElementById('poolEmpty');
    body.innerHTML = '';
    if (!list.length) { table.classList.add('hidden'); empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden'); table.classList.remove('hidden');
    list.forEach(q => {
      const d = DIFF[q.difficulty] || [q.difficulty, ''];
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td>${q.id}</td>
         <td>${escapeHtml(q.content)}</td>
         <td><span class="badge ${d[1]}">${d[0]}</span></td>
         <td>${QTYPE[q.questionType] || q.questionType}</td>
         <td><span class="badge b-pool">${q.status}</span></td>
         <td>${escapeHtml(q.authorName || '')}</td>`;
      body.appendChild(tr);
    });
  }

  function escapeHtml(s) {
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- AI gợi ý độ khó: nhấn Tab trong ô nội dung ----
  async function suggestDifficulty() {
    const content = document.getElementById('content').value.trim();
    const hint = document.getElementById('aiHint');
    if (!content) return;
    const subjectId = document.getElementById('subject').value;
    hint.className = 'ai-hint show loading';
    hint.textContent = '✨ Đang phân tích...';
    try {
      const res = await apiFetch('/api/ai/analyze', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ content, subjectId: subjectId ? Number(subjectId) : null })
      });
      const data = await res.json();
      if (!res.ok) { hint.className = 'ai-hint show'; hint.textContent = data.message || 'Không phân tích được'; return; }
      document.getElementById('difficulty').value = data.difficulty;
      const label = (DIFF[data.difficulty] || [data.difficulty])[0];
      hint.className = 'ai-hint show';
      hint.innerHTML = `✨ <b>AI gợi ý:</b> ${label} — ${escapeHtml(data.reasoning)} `
        + `<span class="muted">(đã điền vào ô Độ khó · ${escapeHtml(data.modelName)})</span>`;
    } catch (e) {
      hint.className = 'ai-hint show'; hint.textContent = 'Lỗi kết nối: ' + e.message;
    }
  }

  document.getElementById('content').addEventListener('keydown', function (e) {
    if (e.key === 'Tab' && !e.shiftKey && this.value.trim().length > 0) {
      e.preventDefault();
      suggestDifficulty();
    }
  });

  const savedLogin = eqfRequireLogin();
  if (savedLogin) {
    eqfRenderShell({ title: 'Ngân hàng câu hỏi', active: 'questions' });
    openQuestionBoard(savedLogin, document.getElementById('loginMsg')).catch((e) => {
      showMsg(document.getElementById('loginMsg'), 'Lỗi kết nối: ' + e.message, false);
    });
  }
</script>
</body>
</html>
